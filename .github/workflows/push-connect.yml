name: Conectar notificaciones

# Se corre a mano cada vez que activás las notificaciones en un
# navegador nuevo (push-activar.html). Guarda la suscripción que dio
# ese navegador para que el workflow diario pueda mandarle avisos.

on:
  workflow_dispatch:
    inputs:
      subscription:
        description: "Código que te mostró push-activar.html después de activar las notificaciones"
        required: true
        type: string

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Guardar la suscripción
        env:
          SUBSCRIPTION_JSON: ${{ inputs.subscription }}
        run: node -e "const fs=require('fs'); const s=JSON.parse(process.env.SUBSCRIPTION_JSON); fs.writeFileSync('push-subscription.json', JSON.stringify(s, null, 2) + '\n');"

      - name: Commit y push de la suscripción
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add push-subscription.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Conectar notificaciones push"
            git push
          fi
