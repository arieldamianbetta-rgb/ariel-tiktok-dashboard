name: Actualizar dashboard de TikTok

on:
  schedule:
    # 15:10 UTC = 12:10 en Argentina (UTC-3)
    - cron: "10 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refrescar estadísticas de TikTok
        run: node fetch-stats.mjs

      - name: Traer noticias del día
        run: node fetch-news.mjs

      - name: Commit y push si hay cambios
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "Sin cambios, no hay nada para commitear."
          else
            git add data.json
            git commit -m "Actualizar métricas ($(date -u +%Y-%m-%d))"
            git push
          fi
