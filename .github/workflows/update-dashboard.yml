name: Actualizar dashboard de TikTok

on:
  schedule:
    # dos corridas por día como respaldo: si GitHub se saltea una
    # (pasa a veces en repos con poca actividad), suele agarrar la otra.
    - cron: "10 12 * * *" # 12:10 UTC = 09:10 en Argentina (UTC-3)
    - cron: "10 21 * * *" # 21:10 UTC = 18:10 en Argentina (UTC-3)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refrescar estadísticas de TikTok
        run: node fetch-stats.mjs

      - name: Traer estadísticas reales de mis videos (API de TikTok)
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ENC_PASSPHRASE: ${{ secrets.TIKTOK_ENC_PASSPHRASE }}
        run: node fetch-tiktok-videos.mjs

      - name: Traer noticias del día
        run: node fetch-news.mjs

      - name: Commit y push si hay cambios
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          if [ -f .tiktok-refresh.enc ]; then git add .tiktok-refresh.enc; fi
          if git diff --cached --quiet; then
            echo "Sin cambios, no hay nada para commitear."
          else
            git commit -m "Actualizar métricas ($(date -u +%Y-%m-%d))"
            git push
          fi
