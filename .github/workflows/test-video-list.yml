name: Test video list
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@4
      - name: Setup Node
        uses: actions/setup-node@4
        with:
          node-version: "20"
      - name: Run test
        run: node test-video-list.mjs
